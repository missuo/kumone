name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_NAME: Kumone
  SPARKLE_VERSION: "2.9.5"
  SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"

jobs:
  macos:
    # Linked against the macOS 27.2 SDK, so the app gets the current window
    # chrome (traffic lights, toolbar) on macOS 27 (#197). The xcode-27 image
    # defaults to Xcode 27.1; DEVELOPER_DIR picks 27.2 for every step.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build number = commit count

      # Xcode 27's default build system compiles mlx's Metal kernels itself,
      # and the runner image does not always ship the Metal toolchain.
      - name: Select Xcode and ensure the Metal toolchain
        run: |
          xcodebuild -version
          echo "macOS SDK $(xcrun --show-sdk-version)"
          xcrun metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      # No restored build cache: under Xcode 27's build system the compiled
      # .build records the Metal compiler at a cryptex mount whose name differs
      # on every runner (MetalToolchain-v27.2.<version>.<random>), so a cache warmed on
      # another machine fails with "unable to spawn process …/metal". A clean
      # build is slower but works on any runner.

      - name: Derive version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          Scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          Scripts/release-notes.sh "$VERSION" --html > "$RUNNER_TEMP/$APP_NAME-$VERSION.html"
          echo "Release notes for $VERSION:"
          cat "$RUNNER_TEMP/notes.md"

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app (universal)
        run: |
          MARKETING_VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
            ARCHES="arm64 x86_64" FETCH_MLX_METALLIB=1 \
            Scripts/build-app.sh release

      - name: Preserve crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-${{ env.VERSION }}-dSYM
          path: .build/app/Kumone.app.dSYM
          if-no-files-found: error

      - name: Codesign (Developer ID, hardened runtime)
        run: |
          APP=".build/app/$APP_NAME.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          codesign -f -o runtime --preserve-metadata=entitlements \
            -s "$SIGN_IDENTITY" "$FW/Versions/B/XPCServices/Downloader.xpc"
          codesign -f -o runtime --preserve-metadata=entitlements \
            -s "$SIGN_IDENTITY" "$FW/Versions/B/XPCServices/Installer.xpc"
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW/Versions/B/Autoupdate"
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW/Versions/B/Updater.app"
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW"
          # build-app.sh signs the compressed stem resource framework before
          # archiving it, using the same SIGN_IDENTITY as the host app.
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=".build/app/$APP_NAME.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          spctl -a -vv --type execute "$APP"

      - name: Package and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent ".build/app/$APP_NAME.app" "dist/$APP_NAME-$VERSION.zip"
          cp "$RUNNER_TEMP/$APP_NAME-$VERSION.html" dist/

          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --embed-release-notes \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/" \
              -o dist/appcast.xml \
              dist
          rm -f "dist/$APP_NAME-$VERSION.html"
          cat dist/appcast.xml

      - name: Hand the macOS build to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/${{ env.APP_NAME }}-${{ env.VERSION }}.zip
            dist/appcast.xml
          if-no-files-found: error

  ios:
    # Runs beside the macOS job instead of after it.
    # iPhone Duo inner display needs the iOS 27.1 SDK (Apple docs);
    # GitHub's xcode-27 image defaults to Xcode 27.1.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build number = commit count

      - name: Derive version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build unsigned iOS IPA
        run: |
          mkdir -p dist
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME-iOS-$VERSION.ipa" Payload)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-dist
          path: dist/${{ env.APP_NAME }}-iOS-${{ env.VERSION }}.ipa
          if-no-files-found: error

  publish:
    needs: [macos, ios]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build number = commit count

      - name: Derive version and release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # altstore-source.sh checks the IPA's CFBundleVersion against this.
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          Scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate AltStore source
        run: |
          bash Scripts/altstore-source.sh "$VERSION" \
            "dist/$APP_NAME-iOS-$VERSION.ipa" "$RUNNER_TEMP/notes.md" \
            > dist/altstore.json
          cat dist/altstore.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$APP_NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/$APP_NAME-$VERSION.zip" \
            "dist/$APP_NAME-iOS-$VERSION.ipa" \
            dist/appcast.xml \
            dist/altstore.json

      - name: Bump Homebrew cask
        # Best-effort: a missing GH_HOMEBREW_TOKEN (or a brew failure) must not
        # fail the release — the app/IPA/appcast are already published above.
        continue-on-error: true
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_HOMEBREW_TOKEN || secrets.HOMEBREW_GITHUB_API_TOKEN || secrets.GH_TOKEN || secrets.PAT }}
        run: |
          SHA="$(shasum -a 256 "dist/$APP_NAME-$VERSION.zip" | awk '{print $1}')"
          git config --global user.email "41898282+github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"
          brew update
          brew tap owo-network/brew
          # Homebrew 5+ refuses to load casks from a third-party tap it has
          # not been told to trust, which silently failed the bump (the step
          # is best-effort) and left the cask at 0.3.0 for several releases.
          brew trust owo-network/brew
          brew bump-cask-pr \
            --version="$VERSION" \
            --sha256="$SHA" \
            --no-browse \
            --no-audit \
            owo-network/brew/kumone

